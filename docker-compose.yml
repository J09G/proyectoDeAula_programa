# ============================================================================
#  ParkingApp - la aplicación en un contenedor, para correrla en local
# ----------------------------------------------------------------------------
#  Usa el mismo Dockerfile que Render. Los secretos se leen de un archivo
#  `.env` en esta misma carpeta (está en .gitignore).
#  Arranca con:  cp .env.example .env  &&  docker compose up --build
#  y abre http://localhost:8080 (o el PORT que pongas en .env).
#
#  No hay nginx: en Render el HTTPS lo pone su propio proxy, y en local la
#  app se usa por HTTP. La configuración de nginx que apuntaba a la red
#  interna de Railway se retiró (US-14).
# ============================================================================

services:

  backend:
    build: .
    container_name: parking-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PORT: ${PORT:-8080}
      MONGODB_URI: ${MONGODB_URI:?Define MONGODB_URI en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      # La app habla HTTP plano; el certificado de desarrollo no se usa aquí.
      SSL_ENABLED: "false"
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
