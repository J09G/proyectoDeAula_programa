# ============================================================================
#  ParkingApp - stack local (backend + nginx)
# ----------------------------------------------------------------------------
#  Los secretos se leen de un archivo `.env` en esta misma carpeta.
#  Arranca con:  cp .env.example .env  &&  docker compose up --build
# ============================================================================

services:

  backend:
    build: .
    container_name: parking-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MONGODB_URI: ${MONGODB_URI:?Define MONGODB_URI en el archivo .env}
      SSL_ENABLED: ${SSL_ENABLED:-false}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@parkingapp.local}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - parking-network

  frontend:
    image: nginx:alpine
    container_name: parking-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - parking-network

networks:
  parking-network:
    driver: bridge
