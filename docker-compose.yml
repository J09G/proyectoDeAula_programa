version: '3.8'

services:

  backend:
    build: .
    container_name: parking-backend
    environment:
      SPRING_DATA_MONGODB_URI: mongodb+srv://Jgomez:52134Jg2005@cluster0.br6d4qz.mongodb.net/parking?appName=Cluster0
    expose:
      - "8080"
