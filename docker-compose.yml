version: '3.8'

services:

  backend:
    build: .
    container_name: parking-backend
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
    expose:
      - "8080"
    networks:
      - parking-network

  frontend:
    image: nginx:alpine
    container_name: parking-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - parking-network

networks:
  parking-network:
    driver: bridge
