<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Parqueaderos - ParkingApp</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/superadmin.css}">
</head>
<body>
<header class="header">
  <div class="logo"><h1>ParkingApp</h1></div>
  <nav class="nav">
    <span class="user-info">Superadministrador</span>
    <a th:href="@{/superadmin}" class="btn">Panel</a>
    <a th:href="@{/superadmin/usuarios}" class="btn">Usuarios</a>
    <a th:href="@{/superadmin/zonas}" class="btn">Zonas</a>
    <form id="logout-form" th:action="@{/logout}" method="post" style="display:none;">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>
    <a href="#" class="btn" onclick="document.getElementById('logout-form').submit(); return false;">Cerrar Sesión</a>
  </nav>
</header>

<main class="superadmin-dashboard">
  <h2>Parqueaderos Registrados</h2>

  <div class="mensajes">
    <p th:if="${mensaje}" th:text="${mensaje}" class="alert alert-success"></p>
    <p th:if="${error}" th:text="${error}" class="alert alert-error"></p>
  </div>

  <!-- Filtros de búsqueda -->
  <form th:action="@{/superadmin/parqueaderos/buscar}" method="get" class="filtros-busqueda">
    <div class="filtro-grupo">
      <label>Por nombre:</label>
      <input type="text" name="nombre" placeholder="Ej: Centro Parking">
    </div>
    <div class="filtro-grupo">
      <label>Por zona:</label>
      <select name="idZona">
        <option value="">Todas las zonas</option>
        <option th:each="zona : ${zonas}"
                th:value="${zona.id}"
                th:text="${zona.nombreZona}"></option>
      </select>
    </div>
    <div class="filtro-grupo">
      <label>Por cédula del administrador:</label>
      <input type="text" name="cedulaAdmin" placeholder="Cédula del admin">
    </div>
    <div class="filtro-acciones">
      <button type="submit" class="btn-primary">Buscar</button>
      <a th:href="@{/superadmin/parqueaderos}" class="btn-secundario">Limpiar</a>
    </div>
  </form>

  <!-- Tabla de parqueaderos -->
  <section>
    <p th:if="${#lists.isEmpty(parqueaderos)}" class="no-data">No hay parqueaderos registrados.</p>

    <div class="tabla-responsive" th:if="${!#lists.isEmpty(parqueaderos)}">
      <table class="tabla-datos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Zona</th>
            <th>Dirección</th>
            <th>Horario</th>
            <th>Tarifa/h</th>
            <th>Espacios</th>
            <th>Administrador</th>
            <th>Cédula Admin</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="parqueadero : ${parqueaderos}">
            <td><strong th:text="${parqueadero.nombre}"></strong></td>
            <td th:text="${parqueadero.zona.nombreZona}"></td>
            <td th:text="${parqueadero.direccion}"></td>
            <td th:text="${parqueadero.horario}"></td>
            <td th:text="'$' + ${parqueadero.tarifaHora}"></td>
            <td>
              <span th:text="${parqueadero.espaciosDisponibles}"></span>
              / <span th:text="${parqueadero.espaciosTotales}"></span>
            </td>
            <td th:text="${parqueadero.administrador != null ? parqueadero.administrador.nombre : 'No asignado'}"></td>
            <td th:text="${parqueadero.administrador != null ? parqueadero.administrador.cedula : '-'}"></td>
            <td>
              <span th:class="${parqueadero.habilitado ? 'estado-activo' : 'estado-inactivo'}"
                    th:text="${parqueadero.habilitado ? 'Activo' : 'Inactivo'}"></span>
            </td>
            <td>
              <form th:action="@{/superadmin/parqueaderos/cambiarEstado}" method="post"
                    style="display:inline; background:none; border:none; padding:0; margin:0;"
                    th:attr="onsubmit=${parqueadero.habilitado} ? 'return confirm(\'¿Deshabilitar este parqueadero?\')' : 'return confirm(\'¿Habilitar este parqueadero?\')'">
                <input type="hidden" name="idParqueadero" th:value="${parqueadero.id}">
                <input type="hidden" name="habilitado" th:value="${!parqueadero.habilitado}">
                <button type="submit"
                        th:class="${parqueadero.habilitado ? 'btn btn-eliminar' : 'btn btn-editar'}"
                        th:text="${parqueadero.habilitado ? 'Deshabilitar' : 'Habilitar'}"></button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 ParkingApp - Todos los derechos reservados</p>
</footer>
</body>
</html>
