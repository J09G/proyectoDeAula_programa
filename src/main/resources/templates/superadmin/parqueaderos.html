<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('superadmin.gestionParqueaderos')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('parqueaderos')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{superadmin.gestionParqueaderos}">Gestión de parqueaderos</h1>
      <p th:text="#{superadmin.gestionParqueaderosSub}">Consulta y controla el estado de los parqueaderos.</p>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-info"  th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error" th:text="${error}"></div>
  </div>

  <form th:action="@{/superadmin/parqueaderos}" method="get" class="filtros-busqueda">
    <div class="filtro-grupo">
      <label th:text="#{superadmin.porNombre}">Por nombre</label>
      <input type="text" name="nombre" th:value="${nombre}" placeholder="Centro Parking">
    </div>
    <div class="filtro-grupo">
      <label th:text="#{superadmin.porZona}">Por zona</label>
      <select name="idZona">
        <option value="" th:text="#{superadmin.todasLasZonas}">Todas las zonas</option>
        <option th:each="zona : ${zonas}" th:value="${zona.id}" th:text="${zona.nombreZona}"
                th:selected="${zona.id == idZona}"></option>
      </select>
    </div>
    <div class="filtro-grupo">
      <label th:text="#{superadmin.porCedulaAdmin}">Por cédula del administrador</label>
      <input type="text" name="cedulaAdmin" th:value="${cedulaAdmin}" th:placeholder="#{superadmin.cedulaAdmin}">
    </div>
    <div class="filtro-acciones">
      <button type="submit" class="btn-secundario" th:text="#{common.buscar}">Buscar</button>
      <a th:href="@{/superadmin/parqueaderos}" class="btn" th:text="#{common.limpiar}">Limpiar</a>
    </div>
  </form>

  <p th:if="${#lists.isEmpty(parqueaderos)}" class="no-data" th:text="#{superadmin.sinParqueaderos}"></p>

  <div class="tabla-responsive" th:if="${!#lists.isEmpty(parqueaderos)}">
    <table class="tabla-datos">
      <thead>
        <tr>
          <th th:text="#{common.nombre}">Nombre</th>
          <th th:text="#{common.zona}">Zona</th>
          <th th:text="#{common.direccion}">Dirección</th>
          <th th:text="#{common.tarifa}">Tarifa</th>
          <th th:text="#{zona.espacios}">Espacios</th>
          <th th:text="#{superadmin.administrador}">Administrador</th>
          <th th:text="#{common.estado}">Estado</th>
          <th th:text="#{common.accion}">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="parqueadero : ${parqueaderos}">
          <td><strong th:text="${parqueadero.nombre}"></strong></td>
          <td th:text="${parqueadero.zona.nombreZona}"></td>
          <td th:text="${parqueadero.direccion}"></td>
          <td th:text="'$' + ${parqueadero.tarifaHora}"></td>
          <td th:text="${parqueadero.espaciosDisponibles} + ' / ' + ${parqueadero.espaciosTotales}"></td>
          <td th:text="${parqueadero.administrador != null
                        ? parqueadero.administrador.nombre
                        : #messages.msg('superadmin.noAsignado')}"></td>
          <td>
            <span th:class="${parqueadero.habilitado ? 'estado-activo' : 'estado-inactivo'}"
                  th:text="${parqueadero.habilitado} ? #{estado.activo} : #{estado.inactivo}"></span>
          </td>
          <td>
            <form th:action="@{/superadmin/parqueaderos/cambiarEstado}" method="post" style="display:inline;"
                  th:attr="onsubmit='return confirm(\'' +
                           (${parqueadero.habilitado}
                             ? #{superadmin.confirmarDeshabilitarParqueadero}
                             : #{superadmin.confirmarHabilitarParqueadero}) + '\')'">
              <input type="hidden" name="idParqueadero" th:value="${parqueadero.id}">
              <input type="hidden" name="habilitado"    th:value="${!parqueadero.habilitado}">
              <button type="submit"
                      th:class="${parqueadero.habilitado ? 'btn-eliminar' : 'btn-editar'}"
                      th:text="${parqueadero.habilitado} ? #{common.deshabilitar} : #{common.habilitar}"></button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{fragments/paginacion :: nav(url='/superadmin/parqueaderos', params=${filtros})}"></div>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
