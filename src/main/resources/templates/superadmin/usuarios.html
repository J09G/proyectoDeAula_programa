<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('superadmin.gestionUsuarios')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('usuarios')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{superadmin.gestionUsuarios}">Gestión de usuarios</h1>
      <p th:text="#{superadmin.gestionUsuariosSub}">Busca, edita y gestiona el estado de los usuarios.</p>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  </div>

  <form th:action="@{/superadmin/usuarios}" method="get" class="form-busqueda">
    <input type="text" name="cedula" th:value="${cedula}" th:placeholder="#{superadmin.buscarCedula}">
    <button type="submit" class="btn-secundario" th:text="#{common.buscar}">Buscar</button>
    <a th:href="@{/superadmin/usuarios}" class="btn" th:text="#{common.verTodos}">Ver todos</a>
  </form>

  <p th:if="${#lists.isEmpty(usuarios)}" class="no-data" th:text="#{superadmin.sinUsuarios}"></p>

  <div class="tabla-responsive" th:if="${!#lists.isEmpty(usuarios)}">
    <table class="tabla-datos">
      <thead>
        <tr>
          <th th:text="#{common.nombre}">Nombre</th>
          <th th:text="#{common.cedula}">Cédula</th>
          <th th:text="#{common.correo}">Correo</th>
          <th th:text="#{common.rol}">Rol</th>
          <th th:text="#{common.estado}">Estado</th>
          <th th:text="#{common.acciones}">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="usuario : ${usuarios}">
          <td><strong th:text="${usuario.nombre}"></strong></td>
          <td th:text="${usuario.cedula}"></td>
          <td th:text="${usuario.correo}"></td>
          <td th:text="${usuario.rol.nombre}"></td>
          <td>
            <span th:class="${usuario.habilitado ? 'estado-activo' : 'estado-inactivo'}"
                  th:text="${usuario.habilitado} ? #{estado.activo} : #{estado.inactivo}"></span>
          </td>
          <td class="acciones-inline">
            <a th:href="@{'/superadmin/editar/' + ${usuario.id}}" class="btn-editar"
               th:text="#{common.editar}">Editar</a>
            <form th:action="@{/superadmin/cambiarEstadoUsuario}" method="post" style="display:inline;">
              <input type="hidden" name="idUsuario"  th:value="${usuario.id}">
              <input type="hidden" name="habilitado" th:value="${!usuario.habilitado}">
              <button type="submit"
                      th:class="${usuario.habilitado} ? 'btn-eliminar' : 'btn-editar'"
                      th:text="${usuario.habilitado} ? #{common.deshabilitar} : #{common.habilitar}"></button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{fragments/paginacion :: nav(url='/superadmin/usuarios', params=${filtros})}"></div>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
