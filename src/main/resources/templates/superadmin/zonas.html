<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('superadmin.gestionZonas')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('zonas')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{superadmin.gestionZonas}">Gestión de zonas</h1>
      <p th:text="#{superadmin.gestionZonasSub}">Crea zonas y controla su visibilidad.</p>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  </div>

  <section class="seccion">
    <h3 th:text="#{superadmin.crearZona}">Crear zona</h3>
    <form th:action="@{/superadmin/zonas/crear}" method="post" style="max-width:420px;">
      <label th:text="#{superadmin.nombreZona}">Nombre de la zona</label>
      <input type="text" name="nombreZona" placeholder="Bocagrande" required>
      <button type="submit" class="btn-primary" th:text="#{superadmin.crearZona}">Crear zona</button>
    </form>
  </section>

  <section class="seccion">
    <h3 th:text="#{superadmin.zonasRegistradas}">Zonas registradas</h3>
    <p th:if="${#lists.isEmpty(zonas)}" class="no-data" th:text="#{superadmin.sinZonas}"></p>

    <div class="tabla-responsive" th:if="${!#lists.isEmpty(zonas)}">
      <table class="tabla-datos">
        <thead>
          <tr>
            <th th:text="#{common.nombre}">Nombre</th>
            <th th:text="#{common.estado}">Estado</th>
            <th th:text="#{common.acciones}">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="zona : ${zonas}">
            <td><strong th:text="${zona.nombreZona}"></strong></td>
            <td>
              <span th:class="${zona.habilitado ? 'estado-activo' : 'estado-inactivo'}"
                    th:text="${zona.habilitado} ? #{superadmin.zonaActiva} : #{superadmin.zonaInactiva}"></span>
            </td>
            <td>
              <form th:action="@{/superadmin/zonas/cambiarEstado}" method="post" style="display:inline;">
                <input type="hidden" name="idZona"     th:value="${zona.id}">
                <input type="hidden" name="habilitado" th:value="${!zona.habilitado}">
                <button type="submit"
                        th:class="${zona.habilitado} ? 'btn-eliminar' : 'btn-editar'"
                        th:text="${zona.habilitado} ? #{common.deshabilitar} : #{common.habilitar}"></button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
