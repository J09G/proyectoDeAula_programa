<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkingApp - Superadministrador</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/superadmin.css}">
</head>
<body>
<div class="app-shell">
  <div class="sb-overlay" id="sbOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6S16.31 3 13 3zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
      </div>
      <span class="sb-brand-name">ParkingApp</span>
    </div>

    <nav class="sb-nav">
      <div class="sb-section">
        <span class="sb-section-label">Gestión</span>
      </div>
      <a th:href="@{/superadmin}" class="sb-link active">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 9.75L12 3l9 6.75V21a.75.75 0 01-.75.75H15.75v-5.25h-7.5V21.75H3.75A.75.75 0 013 21V9.75z"/>
        </svg>
        Inicio
      </a>
      <a th:href="@{/superadmin/parqueaderos}" class="sb-link">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21"/>
        </svg>
        Parqueaderos
      </a>
      <a th:href="@{/superadmin/usuarios}" class="sb-link">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
        </svg>
        Usuarios
      </a>
      <a th:href="@{/superadmin/zonas}" class="sb-link">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
        </svg>
        Zonas
      </a>
      <a th:href="@{/superadmin/dashboard}" class="sb-link">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/>
        </svg>
        Dashboard
      </a>
    </nav>

    <div class="sb-footer">
      <div class="sb-user">
        <div class="sb-avatar">S</div>
        <span class="sb-user-name">Superadministrador</span>
      </div>
      <form id="logout-form" th:action="@{/logout}" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      </form>
      <button class="sb-logout" onclick="document.getElementById('logout-form').submit()">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
  <div class="main-area">
    <header class="topbar">
      <button class="sb-hamburger" id="sbHamburger" aria-label="Abrir menú">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      </button>
      <span class="topbar-title">Panel del Superadministrador</span>
    </header>

    <div class="page-body">
      <div class="page-header">
        <h1>Panel del Superadministrador</h1>
        <p>Registra administradores y gestiona el sistema desde aquí.</p>
      </div>

      <div class="mensajes">
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
      </div>

      <div class="forms-grid">

        <!-- Registrar Administrador -->
        <div class="register-section">
          <h3>Registrar nuevo administrador</h3>
          <form th:action="@{/superadmin/registrarAdministrador}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>Nombre completo</label>
            <input type="text" name="nombre" placeholder="Nombre del administrador" required>
            <label>Cédula</label>
            <input type="text" name="cedula" placeholder="Número de cédula" required>
            <label>Correo electrónico</label>
            <input type="email" name="correo" placeholder="correo@ejemplo.com" required>
            <label>Contraseña</label>
            <input type="password" name="contrasena" placeholder="Contraseña" required>
            <button type="submit" class="btn-primary">Registrar administrador</button>
          </form>
        </div>

      </div>
    </div>
  </div>

</div>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
