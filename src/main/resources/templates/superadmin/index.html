<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('superadmin.panel')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('inicio')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{superadmin.panel}">Panel del superadministrador</h1>
      <p th:text="#{superadmin.panelSub}">Registra administradores y gestiona el sistema.</p>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  </div>

  <section class="seccion">
    <div class="register-section">
      <h3 th:text="#{superadmin.registrarAdmin}">Registrar nuevo administrador</h3>
      <form th:action="@{/superadmin/registrarAdministrador}" method="post">
        <label th:text="#{registro.nombreCompleto}">Nombre completo</label>
        <input type="text" name="nombre" th:placeholder="#{superadmin.nombreAdmin}" required>

        <label th:text="#{common.cedula}">Cédula</label>
        <input type="text" name="cedula" th:placeholder="#{superadmin.numeroCedula}" inputmode="numeric" required>

        <label th:text="#{common.correo}">Correo electrónico</label>
        <input type="email" name="correo" placeholder="correo@ejemplo.com" required>

        <label th:text="#{login.password}">Contraseña</label>
        <input type="password" name="contrasena" th:placeholder="#{registro.passwordHint}"
               minlength="8" required autocomplete="new-password">

        <button type="submit" class="btn-primary" th:text="#{superadmin.registrarBoton}">Registrar</button>
      </form>
    </div>
  </section>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
