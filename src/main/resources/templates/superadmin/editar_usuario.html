<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('superadmin.editarUsuario')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('usuarios')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="${usuario.nombre}">Usuario</h1>
      <p th:text="${usuario.correo}"></p>
    </div>
    <div class="pagina-cabecera-acciones">
      <a th:href="@{/superadmin/usuarios}" class="btn">&larr; <span th:text="#{nav.volver}">Volver</span></a>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
  </div>

  <section class="seccion">
    <h3 th:text="#{superadmin.editarUsuario}">Editar usuario</h3>

    <form th:action="@{/superadmin/actualizar}" method="post" style="max-width:480px;">
      <input type="hidden" name="idUsuario" th:value="${usuario.id}">

      <label th:text="#{common.nombre}">Nombre</label>
      <input type="text" name="nombre" th:value="${usuario.nombre}" required>

      <label th:text="#{common.correo}">Correo electrónico</label>
      <input type="email" name="correo" th:value="${usuario.correo}" required>

      <label th:text="#{common.cedula}">Cédula</label>
      <input type="text" name="cedula" th:value="${usuario.cedula}" inputmode="numeric" required>

      <label th:text="#{common.rol}">Rol</label>
      <!-- Informativo: cambiar el rol de alguien no está contemplado. -->
      <input type="text" th:value="${usuario.rol.nombre}" disabled>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn-primary" th:text="#{common.guardar}">Guardar cambios</button>
        <a th:href="@{/superadmin/usuarios}" class="btn" th:text="#{common.cancelar}">Cancelar</a>
      </div>
    </form>
  </section>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
