<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('cliente.panel')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('zonas')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{cliente.bienvenido}">Bienvenido a ParkingApp</h1>
      <p th:text="#{cliente.bienvenidoSub}">Selecciona una zona para ver los parqueaderos y reservar tu espacio.</p>
    </div>
    <div class="cabecera-dato" th:if="${!#lists.isEmpty(zonas)}">
      <strong th:text="${#lists.size(zonas)}">4</strong>
      <span th:text="#{nav.zonasDisponibles}">Zonas disponibles</span>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  </div>

  <section class="seccion">
    <div class="seccion-cabecera">
      <span class="etiqueta" th:text="#{cliente.explorar}">Explora Cartagena</span>
      <h2 th:text="#{cliente.zonasTitulo}">Zonas disponibles</h2>
    </div>

    <p th:if="${#lists.isEmpty(zonas)}" class="mensaje-vacio" th:text="#{cliente.sinZonas}"></p>

    <div class="zonas-fila" th:unless="${#lists.isEmpty(zonas)}">
      <a th:each="z, it : ${zonas}" th:href="@{'/zona/' + ${z.zona().id}}" class="zona-foto">
        <img th:src="@{${z.imagen()}}" alt="" loading="lazy" onerror="this.remove()">
        <span th:if="${it.first and z.parqueaderos() > 0}" class="insignia" th:text="#{portada.zonas.masPopular}">Más popular</span>
        <span class="zona-foto-pie">
          <span>
            <strong th:text="${z.zona().nombreZona}">Zona</strong>
            <small th:text="${z.parqueaderos() == 1} ? #{portada.zonas.conteoUno(${z.parqueaderos()})} : #{portada.zonas.conteo(${z.parqueaderos()})}">3 parqueaderos</small>
          </span>
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/>
          </svg>
        </span>
      </a>
    </div>
  </section>

  <section class="seccion" id="reservas">
    <div class="seccion-cabecera">
      <span class="etiqueta" th:text="#{nav.misReservas}">Mis reservas</span>
      <h2 th:text="#{cliente.misReservas}">Mis reservas</h2>
      <p th:text="#{cliente.reservasTexto}">El estado de cada solicitud.</p>
    </div>

    <p th:if="${#lists.isEmpty(reservas)}" class="mensaje-vacio" th:text="#{cliente.sinReservas}"></p>

    <div class="tabla-responsive" th:if="${!#lists.isEmpty(reservas)}">
      <table class="tabla-reservas">
        <thead>
          <tr>
            <th th:text="#{cliente.parqueadero}">Parqueadero</th>
            <th th:text="#{common.zona}">Zona</th>
            <th th:text="#{admin.espacio}">Espacio</th>
            <th th:text="#{cliente.fechaLlegada}">Fecha de llegada</th>
            <th th:text="#{common.estado}">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="reserva : ${reservas}">
            <td><strong class="celda-fuerte" th:text="${reserva.parqueadero.nombre}"></strong></td>
            <td th:text="${reserva.parqueadero.zona.nombreZona}"></td>
            <td th:text="${reserva.espacioReservado != null ? '#' + reserva.espacioReservado : '—'}"></td>
            <td th:text="${reserva.fechaReserva != null ? #temporals.format(reserva.fechaReserva, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td>
              <!-- Clase y texto salen del nombre del estado: un estado nuevo no
                   obliga a tocar esta plantilla. -->
              <span th:class="'estado-' + ${#strings.toLowerCase(reserva.estado.name())}"
                    th:text="#{__${'estado.' + reserva.estado.name()}__}"></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
