<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('nav.parqueaderos')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('zonas')}"></nav>

<main class="pagina">

  <!-- La cabecera de la zona lleva su foto bajo el velo teal. -->
  <div class="pagina-cabecera cabecera-foto"
       th:style="'--foto: url(\'' + @{'/images/' + ${zona.nombreZona} + '.jpg'} + '\')'">
    <div>
      <h1 th:text="${zona.nombreZona}">Centro Histórico</h1>
      <p th:text="#{zona.elige}">Elige un parqueadero y reserva tu cubículo en segundos.</p>
    </div>
    <div class="pagina-cabecera-acciones">
      <a th:href="@{/cliente}" class="btn">&larr; <span th:text="#{nav.volver}">Volver</span></a>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${llegada}" class="alert alert-info" th:text="#{reserva.llegadaElegida}"></div>
  </div>

  <div class="seccion-cabecera fila" th:unless="${#lists.isEmpty(parqueaderos)}">
    <span class="etiqueta" th:text="#{zona.conteo(${#lists.size(parqueaderos)})}">3 parqueaderos disponibles</span>
    <span class="vivo" th:text="#{portada.cerca.tiempoReal}">Actualizado en tiempo real</span>
  </div>

  <p th:if="${#lists.isEmpty(parqueaderos)}" class="mensaje-vacio" th:text="#{zona.sinParqueaderos}"></p>

  <div class="parqueo-grid" th:unless="${#lists.isEmpty(parqueaderos)}">
    <article th:each="d : ${parqueaderos}" class="parqueo-card"
             th:insert="~{fragments/tarjetas :: parqueadero(${d}, ${llegada})}"></article>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
