<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Acceso Denegado - ParkingApp</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: bold;
      color: #1a73e8;
      margin: 0;
      line-height: 1;
    }
    .error-title {
      font-size: 1.5rem;
      color: #333;
      margin: 1rem 0 0.5rem;
    }
    .error-message {
      color: #666;
      margin-bottom: 2rem;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo"><h1>ParkingApp</h1></div>
    <nav class="nav">
      <a th:href="@{/login}" class="btn">Iniciar Sesión</a>
    </nav>
  </header>

  <main>
    <div class="error-container">
      <p class="error-code">403</p>
      <h2 class="error-title">Acceso Denegado</h2>
      <p class="error-message">No tienes autorización para acceder a esta página. Si crees que esto es un error, contacta al administrador.</p>
      <a th:href="@{/login}" class="btn-primary">Volver al inicio</a>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 ParkingApp - Todos los derechos reservados</p>
  </footer>
</body>
</html>
