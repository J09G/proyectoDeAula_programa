<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('error.403.titulo')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-wrap">
  <div class="error-card">

    <div class="brand-row">
      <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6S16.31 3 13 3zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
      <span th:text="#{app.nombre}">ParkingApp</span>
    </div>

    <div class="error-icon error-icon-danger">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v2h-2V7zm0 4h2v6h-2v-6z"/></svg>
    </div>

    <p class="error-code">403</p>
    <h1 class="error-title" th:text="#{error.403.titulo}">Acceso denegado</h1>
    <p class="error-message" th:text="#{error.403.texto}">No tienes permiso para ver esta página.</p>

    <div class="error-actions">
      <a th:href="@{/}" class="btn-primary" th:text="#{error.volverInicio}">Volver al inicio</a>
    </div>

  </div>
</div>
</body>
</html>
