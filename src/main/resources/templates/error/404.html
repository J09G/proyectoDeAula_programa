<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('error.404.titulo')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-wrap">
  <div class="error-card">

    <div class="brand-row">
      <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6S16.31 3 13 3zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
      <span th:text="#{app.nombre}">ParkingApp</span>
    </div>

    <div class="error-icon error-icon-info">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </div>

    <p class="error-code">404</p>
    <h1 class="error-title" th:text="#{error.404.titulo}">Página no encontrada</h1>
    <p class="error-message" th:text="${error} ?: #{error.404.texto}">La página que buscas no existe.</p>

    <div class="error-actions">
      <a th:href="@{/}" class="btn-primary" th:text="#{error.volverInicio}">Volver al inicio</a>
    </div>

    <p class="error-path" th:if="${path}" th:text="${path}"></p>
  </div>
</div>
</body>
</html>
