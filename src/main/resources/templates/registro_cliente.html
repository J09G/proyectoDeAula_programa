<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('registro.titulo')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth">

  <aside th:replace="~{fragments/layout :: ladoAuth('registro')}"></aside>

  <div class="auth-columna">

  <div class="auth-controles">
    <div th:replace="~{fragments/layout :: controles}"></div>
  </div>

  <div class="auth-caja">

    <h1 th:text="#{registro.titulo}">Crear cuenta</h1>
    <p class="auth-sub" th:text="#{registro.subtitulo}">Completa tus datos para registrarte</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Los atributos HTML (required, minlength) son sólo una ayuda al usuario.
         La validación que cuenta es la del servidor: RegistroClienteForm. -->
    <form th:action="@{/registro/cliente}" th:object="${form}" method="post">
      <label for="nombre" th:text="#{registro.nombreCompleto}">Nombre completo</label>
      <input type="text" id="nombre" th:field="*{nombre}" placeholder="Juan Pérez" required>
      <small class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>

      <div class="form-row form-row-auth">
        <div class="form-group">
          <label for="cedula" th:text="#{common.cedula}">Cédula</label>
          <input type="text" id="cedula" th:field="*{cedula}" placeholder="123456789" inputmode="numeric" required>
        </div>
        <div class="form-group">
          <label for="placa" th:text="#{registro.placaVehiculo}">Placa</label>
          <input type="text" id="placa" th:field="*{placa}" placeholder="ABC123" required
                 oninput="this.value = this.value.toUpperCase()">
        </div>
      </div>
      <small class="campo-error" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></small>
      <small class="campo-error" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></small>

      <label for="email" th:text="#{common.correo}">Correo electrónico</label>
      <input type="email" id="email" th:field="*{email}" placeholder="tu@correo.com" required>
      <small class="campo-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

      <label for="password" th:text="#{registro.password}">Contraseña</label>
      <input type="password" id="password" th:field="*{password}"
             th:placeholder="#{registro.passwordHint}" minlength="8" required autocomplete="new-password">
      <small class="campo-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

      <label for="confirmPassword" th:text="#{registro.confirmPassword}">Confirmar contraseña</label>
      <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
             th:placeholder="#{registro.confirmPasswordHint}" required autocomplete="new-password">
      <small class="campo-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
      <small class="campo-error" th:if="${#fields.hasErrors('passwordsCoinciden')}" th:errors="*{passwordsCoinciden}"></small>

      <button type="submit" class="btn-primary">
        <span th:text="#{registro.crearCuenta}">Crear cuenta</span>
        <svg th:replace="~{fragments/layout :: flecha}"></svg>
      </button>
    </form>

    <p class="auth-pie">
      <span th:text="#{registro.yaTienesCuenta}">¿Ya tienes cuenta?</span>
      <a th:href="@{/login}" th:text="#{registro.iniciaSesion}">Inicia sesión aquí</a>
    </p>

  </div>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
