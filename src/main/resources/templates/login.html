<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('login.titulo')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth">

  <aside th:replace="~{fragments/layout :: ladoAuth('login')}"></aside>

  <div class="auth-columna">

  <div class="auth-controles">
    <div th:replace="~{fragments/layout :: controles}"></div>
  </div>

  <div class="auth-caja">

    <h1 th:text="#{login.titulo}">Bienvenido de nuevo</h1>
    <p class="auth-sub" th:text="#{login.subtitulo}">Ingresa tus credenciales para continuar</p>

    <div th:if="${param.error != null and param.error[0] == 'credenciales'}"
         class="alert alert-error" th:text="#{login.error.credenciales}"></div>
    <div th:if="${param.error != null and param.error[0] == 'deshabilitado'}"
         class="alert alert-error" th:text="#{login.error.deshabilitado}"></div>
    <div th:if="${param.error != null and param.error[0] == 'bloqueado'}"
         class="alert alert-error" th:text="#{login.error.bloqueado}"></div>
    <div th:if="${param.error != null and param.error[0] == 'google'}"
         class="alert alert-error" th:text="#{login.error.google}"></div>
    <div th:if="${param.logout != null}"  class="alert alert-success" th:text="#{login.logout}"></div>
    <div th:if="${param.expired != null}" class="alert alert-warn"    th:text="#{login.expired}"></div>
    <div th:if="${param.timeout != null}" class="alert alert-warn"    th:text="#{login.timeout}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <form th:action="@{/login}" method="post">
      <label for="email" th:text="#{login.correo}">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="username">

      <label for="password" th:text="#{login.password}">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

      <button type="submit" class="btn-primary">
        <span th:text="#{login.entrar}">Iniciar sesión</span>
        <svg th:replace="~{fragments/layout :: flecha}"></svg>
      </button>
    </form>

    <div class="auth-separador" th:text="#{login.o}">o</div>

    <a th:href="@{/oauth2/authorization/google}" class="btn-google">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      <span th:text="#{login.google}">Continuar con Google</span>
    </a>
    <!-- Ayuda fija, no condicionada al correo: decir "esa cuenta es de Google"
         revelaría qué correos existen, que es justo lo que el login evita. -->
    <p class="auth-ayuda" th:text="#{login.googleAyuda}">¿Te registraste con Google? Entra con este botón.</p>

    <p class="auth-pie">
      <span th:text="#{login.nuevoCliente}">¿Eres nuevo cliente?</span>
      <a th:href="@{/registro/cliente}" th:text="#{login.registrate}">Regístrate aquí</a>
    </p>

  </div>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
