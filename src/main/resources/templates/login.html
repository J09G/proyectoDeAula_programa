<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('login.titulo')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth">

  <aside th:replace="~{fragments/layout :: ladoAuth('login')}"></aside>

  <div class="auth-columna">

  <div class="auth-controles">
    <div th:replace="~{fragments/layout :: controles}"></div>
  </div>

  <div class="auth-caja">

    <h1 th:text="#{login.titulo}">Bienvenido de nuevo</h1>
    <p class="auth-sub" th:text="#{login.subtitulo}">Ingresa tus credenciales para continuar</p>

    <div th:if="${param.error != null and param.error[0] == 'credenciales'}"
         class="alert alert-error" th:text="#{login.error.credenciales}"></div>
    <div th:if="${param.error != null and param.error[0] == 'deshabilitado'}"
         class="alert alert-error" th:text="#{login.error.deshabilitado}"></div>
    <div th:if="${param.error != null and param.error[0] == 'bloqueado'}"
         class="alert alert-error" th:text="#{login.error.bloqueado}"></div>
    <div th:if="${param.logout != null}"  class="alert alert-success" th:text="#{login.logout}"></div>
    <div th:if="${param.expired != null}" class="alert alert-warn"    th:text="#{login.expired}"></div>
    <div th:if="${param.timeout != null}" class="alert alert-warn"    th:text="#{login.timeout}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <form th:action="@{/login}" method="post">
      <label for="email" th:text="#{login.correo}">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="username">

      <label for="password" th:text="#{login.password}">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

      <button type="submit" class="btn-primary">
        <span th:text="#{login.entrar}">Iniciar sesión</span>
        <svg th:replace="~{fragments/layout :: flecha}"></svg>
      </button>
    </form>

    <p class="auth-pie">
      <span th:text="#{login.nuevoCliente}">¿Eres nuevo cliente?</span>
      <a th:href="@{/registro/cliente}" th:text="#{login.registrate}">Regístrate aquí</a>
    </p>

  </div>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
