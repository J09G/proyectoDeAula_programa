<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('admin.misParqueaderos')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('parqueaderos')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{admin.misParqueaderos}">Mis parqueaderos</h1>
      <p th:text="#{admin.misParqueaderosSub}">Gestiona los parqueaderos a tu cargo.</p>
    </div>
    <div class="pagina-cabecera-acciones">
      <button class="btn-primary" onclick="document.getElementById('form-nuevo').classList.toggle('hidden')"
              th:text="'+ ' + #{admin.registrarNuevo}">+ Registrar nuevo</button>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  </div>

  <!-- Alta de parqueadero -->
  <div id="form-nuevo" class="card hidden" style="max-width:640px; margin-bottom:44px;">
    <h3 style="text-transform:none; letter-spacing:-.02em; font-size:1.0625rem; color:var(--gray-900);"
        th:text="#{admin.registrarParqueadero}">Registrar nuevo parqueadero</h3>

    <form th:action="@{/admin/registrarParqueadero}" method="post">
      <label th:text="#{admin.nombreParqueadero}">Nombre</label>
      <input type="text" name="nombre" required>

      <div class="form-row" style="margin-bottom:18px;">
        <div class="form-group">
          <label th:text="#{common.telefono}">Teléfono</label>
          <input type="text" name="telefono" placeholder="3001234567">
        </div>
        <div class="form-group">
          <label th:text="#{common.horario}">Horario</label>
          <input type="text" name="horario" placeholder="7:00 - 22:00" required>
        </div>
      </div>

      <label th:text="#{common.direccion}">Dirección</label>
      <input type="text" name="direccion" required>

      <div class="form-row" style="margin-bottom:18px;">
        <div class="form-group">
          <label th:text="#{common.tarifaHora}">Tarifa por hora ($)</label>
          <input type="number" name="tarifa" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <label th:text="#{admin.espaciosTotales}">Espacios totales</label>
          <input type="number" name="espaciosTotales" min="1" max="500" required>
        </div>
        <div class="form-group">
          <label th:text="#{admin.espaciosDisponibles}">Disponibles</label>
          <input type="number" name="espaciosDisponibles" min="0" required>
        </div>
      </div>

      <label th:text="#{common.zona}">Zona</label>
      <select name="idZona" required>
        <option value="" th:text="'— ' + #{admin.seleccionaZona} + ' —'"></option>
        <option th:each="zona : ${zonas}" th:value="${zona.id}" th:text="${zona.nombreZona}"></option>
      </select>

      <label th:text="#{admin.urlMaps}">Enlace de Google Maps (opcional)</label>
      <input type="url" name="urlMaps" placeholder="https://maps.google.com/...">

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn-primary" th:text="#{admin.registrar}">Registrar</button>
        <button type="button" class="btn" onclick="document.getElementById('form-nuevo').classList.add('hidden')"
                th:text="#{common.cancelar}">Cancelar</button>
      </div>
    </form>
  </div>

  <p th:if="${#lists.isEmpty(parqueaderos)}" class="no-data" th:text="#{admin.sinParqueaderos}"></p>

  <div class="parqueaderos-admin-grid" th:if="${!#lists.isEmpty(parqueaderos)}">
    <div th:each="p : ${parqueaderos}" class="parqueadero-admin-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:14px;">
        <h3 th:text="${p.nombre}">Nombre</h3>
        <span th:class="${p.habilitado ? 'badge-ok' : 'badge-off'}"
              th:text="${p.habilitado} ? #{estado.activo} : #{estado.inactivo}"></span>
      </div>
      <p><strong th:text="#{common.zona}">Zona</strong> <span th:text="${p.zona.nombreZona}"></span></p>
      <p><strong th:text="#{common.direccion}">Dirección</strong> <span th:text="${p.direccion}"></span></p>
      <p style="margin-bottom:20px;"><strong th:text="#{zona.espacios}">Espacios</strong>
         <span th:text="#{zona.libresDe(${p.espaciosDisponibles}, ${p.espaciosTotales})}"></span></p>

      <div style="margin-top:auto;">
        <a th:if="${p.habilitado}" th:href="@{/admin/parqueadero/{id}(id=${p.id})}"
           class="btn-primary" th:text="#{admin.gestionar} + ' →'">Gestionar</a>
        <span th:unless="${p.habilitado}" class="btn-disabled" th:text="#{admin.deshabilitadoPorSuper}"></span>
      </div>
    </div>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
<script th:if="${error}">
  // Si el alta falló, se reabre el formulario para no perder el contexto.
  document.getElementById('form-nuevo').classList.remove('hidden');
</script>
</body>
</html>
