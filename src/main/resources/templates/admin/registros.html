<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('registros.titulo')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('parqueaderos')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{registros.titulo}">Entradas y salidas</h1>
      <p th:text="${parqueadero.nombre}"></p>
    </div>
    <div class="pagina-cabecera-acciones">
      <a th:href="@{/admin/parqueadero/{id}(id=${parqueadero.id})}" class="btn">
        &larr; <span th:text="#{nav.volver}">Volver</span></a>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  </div>

  <!-- Registrar entrada -->
  <section class="seccion">
    <h3 th:text="#{registros.registrarEntrada}">Registrar entrada</h3>

    <div class="cubiculos-legend">
      <span><span class="legend-dot libre"></span><span th:text="#{cubiculo.libre}">Libre</span></span>
      <span><span class="legend-dot pendiente"></span><span th:text="#{cubiculo.pendiente}">Solicitado</span></span>
      <span><span class="legend-dot ocupado"></span><span th:text="#{cubiculo.ocupado}">Ocupado</span></span>
    </div>

    <div th:if="${parqueadero.espaciosTotales > 0}" class="cubiculos-grid" style="margin-bottom:24px;">
      <th:block th:each="i : ${#numbers.sequence(1, parqueadero.espaciosTotales)}">
        <div th:if="${espaciosOcupados.contains(i)}" class="cubiculo ocupado" th:text="${i}"></div>
        <div th:if="${!espaciosOcupados.contains(i) and espaciosPendientes.contains(i)}"
             class="cubiculo pendiente" th:text="${i}"></div>
        <div th:if="${!espaciosOcupados.contains(i) and !espaciosPendientes.contains(i)}"
             class="cubiculo libre cubiculo-selectable" th:text="${i}"
             th:attr="data-num=${i}" onclick="seleccionarCubiculo(this)"></div>
      </th:block>
    </div>

    <form th:action="@{/admin/parqueadero/{id}/registros/entrada(id=${parqueadero.id})}" method="post" class="form-entrada">
      <input type="hidden" name="espacioReservado" id="espacioSeleccionado" value="0">

      <div class="form-row" style="margin-bottom:18px;">
        <div class="form-group">
          <label th:text="#{registros.placaVehiculo}">Placa</label>
          <input type="text" name="placa" placeholder="ABC123" required
                 oninput="this.value = this.value.toUpperCase()">
        </div>
        <div class="form-group">
          <label th:text="#{common.cedula} + ' (' + #{common.opcional} + ')'">Cédula</label>
          <input type="text" name="cedula" inputmode="numeric">
        </div>
      </div>

      <p style="font-size:0.9375rem; color:var(--gray-500); margin-bottom:18px;">
        <span th:text="#{reserva.espacioSeleccionado}">Espacio seleccionado</span>:
        <strong id="espacioTexto" style="color:var(--gray-900);" th:text="#{reserva.ninguno}">Ninguno</strong>
      </p>

      <button type="submit" class="btn-primary" id="btnEntrada" disabled
              th:text="#{registros.registrarEntrada}">Registrar entrada</button>
    </form>
  </section>

  <!-- Vehículos dentro -->
  <section class="seccion">
    <h3>
      <span th:text="#{registros.vehiculosDentro}">Vehículos en el parqueadero</span>
      <span class="badge-count" th:text="${#lists.size(activos)}"></span>
    </h3>

    <div th:if="${!#lists.isEmpty(activos)}" class="form-buscar">
      <input type="text" id="buscarPlacaActivos" th:placeholder="#{registros.buscarPlaca}"
             oninput="filtrarTabla('buscarPlacaActivos', 'tablaActivos', 1)" style="max-width:300px;">
    </div>

    <p th:if="${#lists.isEmpty(activos)}" class="no-data" th:text="#{registros.sinActivos}"></p>

    <div class="tabla-responsive" th:if="${!#lists.isEmpty(activos)}">
      <table class="tabla-datos" id="tablaActivos">
        <thead>
          <tr>
            <th th:text="#{admin.espacio}">Espacio</th>
            <th th:text="#{common.placa}">Placa</th>
            <th th:text="#{admin.cliente}">Cliente</th>
            <th th:text="#{factura.conReserva}">Con reserva</th>
            <th th:text="#{registros.entrada}">Entrada</th>
            <th th:text="#{common.acciones}">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="reg : ${activos}">
            <td th:text="${reg.espacioReservado != null ? '#' + reg.espacioReservado : '—'}"></td>
            <td><strong th:text="${reg.placa}"></strong></td>
            <td th:text="${reg.usuario != null ? reg.usuario.nombre + ' · ' + reg.usuario.cedula : #messages.msg('registros.dePaso')}"></td>
            <td>
              <span th:if="${reg.reserva != null}"     class="badge-reserva"     th:text="#{common.si}">Sí</span>
              <span th:unless="${reg.reserva != null}" class="badge-sin-reserva" th:text="#{common.no}">No</span>
            </td>
            <td th:text="${#temporals.format(reg.horaEntrada, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <form th:action="@{/admin/parqueadero/{id}/registros/salida/{rid}(id=${parqueadero.id},rid=${reg.id})}"
                    method="post" style="display:inline;"
                    th:attr="onsubmit='return confirm(\'' + #{registros.confirmarSalida} + '\')'">
                <button type="submit" class="btn-salida" th:text="#{registros.registrarSalida}">Registrar salida</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Historial -->
  <section class="seccion">
    <h3 th:text="#{registros.historial}">Historial de registros</h3>

    <div th:if="${!#lists.isEmpty(historial)}" class="form-buscar">
      <input type="text" id="buscarPlacaHistorial" th:placeholder="#{registros.buscarPlaca}"
             oninput="filtrarTabla('buscarPlacaHistorial', 'tablaHistorial', 1)" style="max-width:300px;">
    </div>

    <p th:if="${#lists.isEmpty(historial)}" class="no-data" th:text="#{registros.sinHistorial}"></p>

    <div class="tabla-responsive" th:if="${!#lists.isEmpty(historial)}">
      <table class="tabla-datos" id="tablaHistorial">
        <thead>
          <tr>
            <th th:text="#{admin.espacio}">Espacio</th>
            <th th:text="#{common.placa}">Placa</th>
            <th th:text="#{admin.cliente}">Cliente</th>
            <th th:text="#{registros.entrada}">Entrada</th>
            <th th:text="#{registros.salida}">Salida</th>
            <th th:text="#{registros.tiempo}">Tiempo</th>
            <th th:text="#{registros.valor}">Valor</th>
            <th th:text="#{common.estado}">Estado</th>
            <th th:text="#{common.acciones}">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="reg : ${historial}">
            <td th:text="${reg.espacioReservado != null ? '#' + reg.espacioReservado : '—'}"></td>
            <td><strong th:text="${reg.placa}"></strong></td>
            <td th:text="${reg.usuario != null ? reg.usuario.nombre : #messages.msg('registros.dePaso')}"></td>
            <td th:text="${#temporals.format(reg.horaEntrada, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${reg.horaSalida != null ? #temporals.format(reg.horaSalida, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td>
              <span th:if="${reg.tiempoMinutos != null}"
                    th:text="${reg.tiempoMinutos / 60} + 'h ' + ${reg.tiempoMinutos % 60} + 'min'"></span>
              <span th:unless="${reg.tiempoMinutos != null}">—</span>
            </td>
            <td th:text="${reg.valorPagado != null ? '$' + reg.valorPagado : '—'}"></td>
            <td>
              <span th:class="${reg.estado.name() == 'ACTIVO'} ? 'estado-activo' : 'estado-finalizado'"
                    th:text="#{__${'estado.' + reg.estado.name()}__}"></span>
            </td>
            <td>
              <a th:if="${reg.estado.name() == 'FINALIZADO'}"
                 th:href="@{/admin/parqueadero/{id}/registros/factura/{rid}(id=${parqueadero.id},rid=${reg.id})}"
                 class="btn-editar" th:text="#{registros.verFactura}">Factura</a>
              <span th:unless="${reg.estado.name() == 'FINALIZADO'}">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div th:replace="~{fragments/paginacion :: nav(url='/admin/parqueadero/' + ${parqueadero.id} + '/registros', params='')}"></div>
  </section>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
<script>
  var espacioActual = null;

  function seleccionarCubiculo(el) {
    if (espacioActual) { espacioActual.classList.remove('cubiculo-activo'); }
    espacioActual = el;
    el.classList.add('cubiculo-activo');
    var num = el.getAttribute('data-num');
    document.getElementById('espacioSeleccionado').value = num;
    document.getElementById('espacioTexto').textContent = '#' + num;
    document.getElementById('btnEntrada').disabled = false;
  }

  /* Filtro en cliente: sólo afecta a las filas de la página actual, porque el
     historial viene paginado desde el servidor. */
  function filtrarTabla(inputId, tablaId, columna) {
    var filtro = document.getElementById(inputId).value.toUpperCase();
    var filas  = document.getElementById(tablaId).getElementsByTagName('tr');
    for (var i = 1; i < filas.length; i++) {
      var celda = filas[i].getElementsByTagName('td')[columna];
      if (celda) {
        filas[i].style.display = celda.textContent.toUpperCase().indexOf(filtro) > -1 ? '' : 'none';
      }
    }
  }
</script>
</body>
</html>
