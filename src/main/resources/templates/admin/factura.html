<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('factura.titulo')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/factura.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('parqueaderos')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="#{factura.titulo}">Factura</h1>
      <p th:text="${registro.parqueadero.nombre}"></p>
    </div>
    <div class="pagina-cabecera-acciones">
      <a th:href="@{/admin/parqueadero/{id}/registros/factura/pdf/{rid}(id=${registro.parqueadero.id},rid=${registro.id})}"
         class="btn-primary" th:text="#{factura.descargarPdf}">Descargar PDF</a>
      <button onclick="window.print()" class="btn-secundario" th:text="#{factura.imprimir}">Imprimir</button>
      <a th:href="@{/admin/parqueadero/{id}/registros(id=${registro.parqueadero.id})}" class="btn"
         th:text="#{factura.volver}">Volver</a>
    </div>
  </div>

  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <div th:if="${registro}" class="factura-wrap" id="factura">
    <div class="factura-box">

      <div class="factura-head">
        <h2 th:text="#{app.nombre}">ParkingApp</h2>
        <p th:text="${registro.parqueadero.nombre}"></p>
        <p th:text="${registro.parqueadero.direccion}"></p>
        <p class="factura-num" th:text="#{factura.numero(${registro.id})}"></p>
      </div>

      <table class="factura-table">
        <tr>
          <td th:text="#{factura.placa}">Placa</td>
          <td th:text="${registro.placa}"></td>
        </tr>
        <tr>
          <td th:text="#{factura.espacio}">Espacio #</td>
          <td th:text="${registro.espacioReservado != null ? registro.espacioReservado : '—'}"></td>
        </tr>
        <tr>
          <td th:text="#{factura.cliente}">Cliente</td>
          <td th:text="${registro.usuario != null ? registro.usuario.nombre : #messages.msg('registros.dePaso')}"></td>
        </tr>
        <tr th:if="${registro.usuario != null}">
          <td th:text="#{common.cedula}">Cédula</td>
          <td th:text="${registro.usuario.cedula}"></td>
        </tr>
        <tr>
          <td th:text="#{factura.conReserva}">Con reserva</td>
          <td th:text="${registro.reserva != null}
                       ? #messages.msg('common.si') + ' · #' + ${registro.reserva.id}
                       : #messages.msg('common.no')"></td>
        </tr>
        <tr>
          <td th:text="#{factura.horaEntrada}">Entrada</td>
          <td th:text="${#temporals.format(registro.horaEntrada, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr>
          <td th:text="#{factura.horaSalida}">Salida</td>
          <td th:text="${#temporals.format(registro.horaSalida, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr>
          <td th:text="#{factura.tiempo}">Tiempo</td>
          <td th:text="${registro.tiempoMinutos / 60} + 'h ' + ${registro.tiempoMinutos % 60} + 'min'"></td>
        </tr>
        <tr>
          <td th:text="#{factura.tarifaHora}">Tarifa/hora</td>
          <!-- Tarifa congelada al entrar: es la que se cobró, aunque el
               administrador la haya cambiado después. -->
          <td th:text="'$' + ${registro.tarifaHoraAplicada != null ? registro.tarifaHoraAplicada : registro.parqueadero.tarifaHora}"></td>
        </tr>
      </table>

      <div class="factura-total">
        <span class="factura-total-label" th:text="#{factura.total}">Total a pagar</span>
        <span class="factura-total-value" th:text="'$' + ${registro.valorPagado}"></span>
      </div>
    </div>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
