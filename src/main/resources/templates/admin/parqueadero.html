<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: cabeza('nav.miParqueadero')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: barra('parqueaderos')}"></nav>

<main class="pagina">

  <div class="pagina-cabecera">
    <div>
      <h1 th:text="${parqueadero.nombre}">Parqueadero</h1>
      <p th:text="${parqueadero.direccion + ' · ' + parqueadero.zona.nombreZona}"></p>
    </div>
    <div class="pagina-cabecera-acciones">
      <a th:href="@{/admin/parqueadero/{id}/registros(id=${parqueadero.id})}" class="btn-primary"
         th:text="#{nav.entradasSalidas}">Entradas y salidas</a>
      <a th:href="@{/admin/parqueadero/{id}/editar(id=${parqueadero.id})}" class="btn"
         th:text="#{admin.configuracion}">Configuración</a>
      <a th:href="@{/admin}" class="btn">&larr; <span th:text="#{nav.volver}">Volver</span></a>
    </div>
  </div>

  <div class="mensajes">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  </div>

  <!-- Indicadores -->
  <div class="kpi-grid">
    <div class="kpi-card kpi-brand">
      <p class="kpi-label" th:text="#{admin.kpi.ocupados}">Espacios ocupados</p>
      <p class="kpi-value" th:text="${parqueadero.espaciosTotales - parqueadero.espaciosDisponibles}">0</p>
      <p class="kpi-sub" th:text="#{admin.kpi.deTotales(${parqueadero.espaciosTotales})}"></p>
    </div>
    <div class="kpi-card kpi-warn">
      <p class="kpi-label" th:text="#{admin.kpi.pendientes}">Reservas pendientes</p>
      <p class="kpi-value" th:text="${totalPendientes}">0</p>
      <p class="kpi-sub" th:text="#{admin.kpi.enEspera}">en espera</p>
    </div>
    <div class="kpi-card kpi-success">
      <p class="kpi-label" th:text="#{admin.kpi.aceptadas}">Reservas aceptadas</p>
      <p class="kpi-value" th:text="${totalAceptadas}">0</p>
      <p class="kpi-sub" th:text="#{admin.kpi.estePeriodo}">este período</p>
    </div>
  </div>

  <!-- Solicitudes de reserva -->
  <section class="seccion" id="reservas">
    <h3 th:text="#{admin.solicitudesReserva}">Solicitudes de reserva</h3>

    <div class="form-buscar">
      <form th:action="@{/admin/parqueadero/{id}(id=${parqueadero.id})}" method="get"
            style="display:flex; gap:10px; flex-wrap:wrap; width:100%;">
        <input type="text" name="cedula" th:value="${cedula}" th:placeholder="#{admin.buscarPorCedula}" style="max-width:340px;">
        <button type="submit" class="btn-secundario" th:text="#{common.buscar}">Buscar</button>
        <a th:href="@{/admin/parqueadero/{id}(id=${parqueadero.id})}" class="btn" th:text="#{common.verTodos}">Ver todas</a>
      </form>
    </div>

    <p th:if="${#lists.isEmpty(reservas)}" class="no-data" th:text="#{admin.sinSolicitudes}"></p>

    <div class="tabla-responsive" th:if="${!#lists.isEmpty(reservas)}">
      <table class="tabla-datos">
        <thead>
          <tr>
            <th th:text="#{admin.cliente}">Cliente</th>
            <th th:text="#{common.cedula}">Cédula</th>
            <th th:text="#{common.placa}">Placa</th>
            <th th:text="#{admin.espacio}">Espacio</th>
            <th th:text="#{common.fecha}">Fecha</th>
            <th th:text="#{common.estado}">Estado</th>
            <th th:text="#{common.acciones}">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="reserva : ${reservas}">
            <td th:text="${reserva.cliente.nombre}"></td>
            <td th:text="${reserva.cliente.cedula}"></td>
            <td th:text="${reserva.cliente.placa != null ? reserva.cliente.placa : '—'}"></td>
            <td th:text="${reserva.espacioReservado != null ? '#' + reserva.espacioReservado : '—'}"></td>
            <td th:text="${reserva.fechaReserva != null ? #temporals.format(reserva.fechaReserva, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td>
              <span th:class="'estado-' + ${#strings.toLowerCase(reserva.estado.name())}"
                    th:text="#{__${'estado.' + reserva.estado.name()}__}"></span>
            </td>
            <td class="acciones-inline">
              <th:block th:if="${reserva.estado.name() == 'PENDIENTE'}">
                <form th:action="@{/admin/parqueadero/{id}/reserva/aceptar/{rid}(id=${parqueadero.id},rid=${reserva.id})}"
                      method="post" style="display:inline;">
                  <input type="hidden" name="pagina" th:value="${paginaActual}"/>
                  <input type="hidden" name="cedula" th:if="${cedula}" th:value="${cedula}"/>
                  <button type="submit" class="btn-accion btn-aceptar-sm" th:text="#{common.aceptar}">Aceptar</button>
                </form>
                <form th:action="@{/admin/parqueadero/{id}/reserva/rechazar/{rid}(id=${parqueadero.id},rid=${reserva.id})}"
                      method="post" style="display:inline;">
                  <input type="hidden" name="pagina" th:value="${paginaActual}"/>
                  <input type="hidden" name="cedula" th:if="${cedula}" th:value="${cedula}"/>
                  <button type="submit" class="btn-accion btn-rechazar-sm" th:text="#{common.rechazar}">Rechazar</button>
                </form>
              </th:block>

              <!-- ACEPTADA: registrar la entrada del vehículo -->
              <th:block th:if="${reserva.estado.name() == 'ACEPTADA'}">
                <form th:action="@{/admin/parqueadero/{id}/registros/entrada(id=${parqueadero.id})}"
                      method="post" style="display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap;">
                  <input type="hidden" name="cedula" th:value="${reserva.cliente.cedula}"/>
                  <input type="hidden" name="espacioReservado" th:value="${reserva.espacioReservado != null ? reserva.espacioReservado : 0}"/>
                  <input type="text" name="placa" th:value="${reserva.cliente.placa}"
                         th:placeholder="#{common.placa}" style="width:100px; margin-bottom:0;" required>
                  <button type="submit" class="btn-accion btn-aceptar-sm" th:text="#{registros.entrada}">Entrada</button>
                </form>
              </th:block>

              <form th:action="@{/admin/parqueadero/{id}/reserva/eliminar/{rid}(id=${parqueadero.id},rid=${reserva.id})}"
                    method="post" style="display:inline;"
                    th:attr="onsubmit='return confirm(\'' + #{admin.confirmarEliminarReserva} + '\')'">
                <input type="hidden" name="pagina" th:value="${paginaActual}"/>
                <input type="hidden" name="cedula" th:if="${cedula}" th:value="${cedula}"/>
                <button type="submit" class="btn-accion btn-eliminar-sm" th:text="#{common.eliminar}">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div th:replace="~{fragments/paginacion :: nav(url='/admin/parqueadero/' + ${parqueadero.id}, params=${filtros})}"></div>
  </section>

  <!-- Comentarios -->
  <section class="seccion">
    <h3 th:text="#{admin.comentarios}">Comentarios de los clientes</h3>
    <p th:if="${#lists.isEmpty(comentarios)}" class="no-data" th:text="#{admin.sinComentarios}"></p>
    <div th:each="c : ${comentarios}" class="comment-card">
      <div class="comment-meta">
        <span class="comment-author" th:text="${c.cliente.nombre}">Cliente</span>
        <span class="comment-date" th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}"></span>
      </div>
      <p class="comment-body" th:text="${c.texto}">Comentario</p>
    </div>
  </section>

</main>

<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
