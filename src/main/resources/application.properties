spring.application.name=parking

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=parking

server.port=${PORT:8080}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=parking123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=parking
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=false

# === SESIÓN Y COOKIES ===
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# === CONFIGURACIÓN DE CORREO (Brevo API) ===
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=josephgomeztatis@gmail.com

# === JWT (API stateless /api/**) ===
# En produccion, JWT_SECRET debe definirse como variable de entorno (minimo 256 bits / 32 caracteres para HS256).
# El valor por defecto solo sirve para desarrollo local.
jwt.secret=${JWT_SECRET:dev-only-secret-cambiar-en-produccion-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
